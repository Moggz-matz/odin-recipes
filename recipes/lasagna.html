    <h2>Description</h2>
    <p>Lasagna is the ultimate comforting Italian dish, built on layers of tender pasta sheets, rich savory sauce, and a decadent blend of melted cheeses. The foundation of a great lasagna begins with a deeply flavored ragù, typically made by simmering ground beef, Italian sausage, garlic, and onions in a robust, herb-infused tomato sauce.</p>

    <p>This savory meat mixture is alternated between wide lasagna noodles and a creamy cheese filling, which traditionally features riccota, a touch of egg for binding, fresh parsley, and a generous handful of parmesan. Each layer brings a perfect balance of textures, ensuring every bite is packed with savory, herbaceous depth</p>

    <h2>Engridients</h2>
    <ul>
        <li>Lasagna noodles</li>
        <li>Italian sausage</li>
        <li>Crashed tomatoes</li>
        <li>Riccota Cheese</li>
        <li>Mozarella Cheese</li>
    </ul>

    <h2>Steps</h2>
    <ol type="1">
        <li>Simmer the sauce: Brown the ground meat with garlic and onions, then simmer with crushed tomatoes and herbs.</li>
        <li>Mix the cheese: Stir together the ricotta, a beaten egg, parmesan, and parsley until smooth.</li>
        <li>Layer the dish: Alternate layers of sauce, noodles, ricotta mixture, and shredded mozzarella in a baking dish.</li>
        <li>4. ake the lasagna: Cover with foil and bake at 375°F (190°C) for 25 minutes, then uncover for 20 minutes until bubbly.</li>
        <li>Rest and slice: Let the lasagna sit for 15 minutes to firm up before serving.</li>
    </ol>
